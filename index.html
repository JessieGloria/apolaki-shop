<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apolaki · Handmade brass jewellery</title>
<meta name="description" content="Handmade brass jewellery by Jason Labunda. Bracelets, earrings and rings, made to order and shipped across Malaysia.">
<meta name="theme-color" content="#f7f3ec">
<meta property="og:title" content="Apolaki · Handmade brass jewellery">
<meta property="og:description" content="Handmade brass jewellery by Jason Labunda.">
<meta property="og:image" content="logo.png">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Poppins:wght@400;500;600&display=swap">
<link rel="stylesheet" href="shop.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="Apolaki home">
    <img src="logo.png" alt="" width="40" height="28">
    <span>Apolaki</span>
  </a>
  <button class="basket-btn" id="basketBtn" type="button" aria-label="Open basket">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
    <b id="basketCount" hidden>0</b>
  </button>
</header>

<main id="view" tabindex="-1"></main>

<footer class="foot">
  <img src="logo.png" alt="" width="34" height="24">
  <p><strong>Apolaki</strong> · handmade brass jewellery by Jason Labunda</p>
  <p class="muted" id="footContact"></p>
</footer>

<div class="overlay" id="overlay" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></aside>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Basket" hidden></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="shop.js"></script>
</body>
</html>
